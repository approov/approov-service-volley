plugins {
    id 'com.android.library'
    id 'maven-publish'
    id 'com.gradleup.shadow' version '8.3.11'
}

repositories {
    mavenCentral()
    google()
}

android {
    namespace = 'io.approov.service.volley'
    compileSdk 34

    buildFeatures {
        // AGP 8 disables BuildConfig generation by default; we need it to expose
        // the service-layer version to runtime code (see APPROOV_SERVICE_VERSION below).
        buildConfig true
    }

    defaultConfig {
        minSdkVersion 23
        targetSdkVersion 34

        // The published service-layer version, fed by CI from the release git tag
        // (-PapproovServiceVersion=X.Y.Z). Local/test builds get "dev". This is the
        // single source of truth for the version baked into the compiled AAR.
        def serviceVersion = (project.findProperty('approovServiceVersion') ?: 'dev')
        buildConfigField "String", "APPROOV_SERVICE_VERSION", "\"${serviceVersion}\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            consumerProguardFiles 'consumer-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    testOptions {
        unitTests {
            includeAndroidResources = false
            returnDefaultValues = true
        }
        unitTests.all {
            jvmArgs '-Dnet.bytebuddy.experimental=true'
        }
    }
}

configurations {
    shadowed
}

// When the core-service-layers-testing mini-sdk is available it replaces the released
// Approov SDK on the test classpath so the SDK behaviour can be simulated. Without it
// the tests compile and run against the released SDK classes (mini-sdk-backed tests
// are skipped below).
if (findProject(':approov-sdk') != null) {
    configurations.testImplementation {
        exclude group: 'io.approov', module: 'approov-android-sdk'
    }
}

tasks.register('shadowJar', com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar) {
    archiveClassifier.set('shadow')
    configurations = [project.configurations.shadowed]
    relocate 'org.bouncycastle', 'io.approov.internal.volley.bouncycastle'
    exclude 'META-INF/**'
}

dependencies {
    implementation 'com.android.volley:volley:1.2.1'
    implementation 'io.approov:approov-android-sdk:3.5.3'
    shadowed 'org.bouncycastle:bcprov-jdk15to18:1.80'
    implementation files(tasks.named('shadowJar'))
    implementation 'androidx.annotation:annotation-jvm:1.9.1'
    // The closed-source Approov SDK (io.approov:approov-android-sdk:3.5.3) uses okhttp3 internally
    // (okhttp3.Request/Call/CertificatePinner/EventListener). It does not bundle or declare okhttp,
    // so the service layer must supply it transitively at runtime, otherwise Approov.initialize()
    // fails with NoClassDefFoundError: okhttp3.EventListener. The service layer's OWN code no longer
    // references okhttp (pin hashing moved to the platform MessageDigest/Base64), hence runtimeOnly
    // rather than implementation: it is shipped/declared for the SDK but kept off the compile classpath.
    runtimeOnly 'com.squareup.okhttp3:okhttp:4.12.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-inline:5.2.0'
    // Test-only compile dependency: the message-signing unit tests (SignatureBaseBuilderTest,
    // TestComponentProvider) build fixture requests with okhttp3.Request/Headers.
    testImplementation 'com.squareup.okhttp3:okhttp:4.12.0'
    if (findProject(':approov-sdk') != null) {
        testImplementation project(':approov-sdk')
    }
    if (findProject(':test-support') != null) {
        testImplementation project(':test-support')
    }
    testImplementation 'org.robolectric:robolectric:4.11.1'
    testImplementation 'org.json:json:20231013'
    testImplementation 'androidx.test:core:1.6.1'
}

tasks.withType(JavaCompile) {
    dependsOn tasks.named('shadowJar')
}

// the mini-sdk test exercises the full request flow against the simulated attester and
// cannot compile or run without the core-service-layers-testing projects
if (findProject(':test-support') == null) {
    android.sourceSets.test.java.exclude '**/ApproovServiceMiniSdkTest.java'
    tasks.withType(Test).configureEach {
        exclude '**/ApproovServiceMiniSdkTest*'
    }
}
