def localProperties = new Properties()
def localPropertiesFile = new File(rootDir, 'local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { inputStream ->
        localProperties.load(inputStream)
    }
}

def miniSdkRoot = localProperties.getProperty('miniSdkAndroidRoot', '../core-service-layers-testing/mini-sdk/android')
def miniSdkRootDir = new File(miniSdkRoot).isAbsolute() ? new File(miniSdkRoot) : new File(rootDir, miniSdkRoot)
def approovSdkDir = new File(miniSdkRootDir, 'approov-sdk')
def testSupportDir = new File(miniSdkRootDir, 'test-support')

if (rootProject.name != 'approov-service') {
    include ':approov-service'
}

if (approovSdkDir.exists() && testSupportDir.exists()) {
    include ':approov-sdk'
    project(':approov-sdk').projectDir = approovSdkDir
    
    include ':test-support'
    project(':test-support').projectDir = testSupportDir
} else {
    println "WARNING: core-service-layers-testing not found at ${miniSdkRootDir}."
    println "Mini-sdk backed tests will be skipped; the remaining tests run against the released Approov SDK classes."
}
