include ':approov-service'

def approovSdkDir = new File('../core-service-layers-testing/mini-sdk/android/approov-sdk')
def testSupportDir = new File('../core-service-layers-testing/mini-sdk/android/test-support')

if (approovSdkDir.exists() && testSupportDir.exists()) {
    include ':approov-sdk'
    project(':approov-sdk').projectDir = approovSdkDir
    
    include ':test-support'
    project(':test-support').projectDir = testSupportDir
} else {
    println "WARNING: core-service-layers-testing not found at ../core-service-layers-testing."
    println "Integration tests requiring the test-support or mini-sdk will not compile."
}
